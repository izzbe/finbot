[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ruff>=0.15.12",
]

[tool.uv.workspace]
members = ["services/*/*", "packages/*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "lab>=8.9",
]
